<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Friend ✨</title>
    <link rel="shortcut icon" href="images/flower-site-icon.png" type="image/png/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="light-mode">
    <!-- Unfolding animation overlay -->
    <div class="page-unfold"></div>

    <!-- Theme toggle -->
    <div class="theme-toggle">
        <button id="themeButton" aria-label="Toggle theme">
            <span class="sun">☀️</span>
            <span class="moon">🌙</span>
        </button>
    </div>

    <!-- Music toggle -->
    <div class="music-toggle">
        <button id="musicButton" aria-label="Toggle music">
            <span class="music-on">🎵</span>
            <span class="music-off">🔇</span>
        </button>
    </div>

    <!-- Main container -->
    <div class="container">
        <!-- Particles background -->
        <div class="particles"></div>
        
        <!-- Floating flowers background -->
        <div class="floating-flowers">
            <div class="float-flower"></div>
            <div class="float-flower"></div>
            <div class="float-flower"></div>
            <div class="float-flower"></div>
            <div class="float-flower"></div>
            <div class="float-flower"></div>
        </div>
        
        <!-- Center flower -->
        <div class="center-flower">
            <div class="flower-center"></div>
            <div class="petals">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
            </div>
        </div>

        <!-- Main content -->
        <div class="main-content hidden">
            <h1 class="title">Happy Valentine's Day!</h1>
            <h2 class="subtitle">You</h2>
            
            <!-- Cards container -->
            <div class="cards-container">
                <div class="card">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-design">Tap to reveal ♥</div>
                        </div>
                        <div class="card-back">
                            <p>"You are so loved; I hope you feel that today and every day!🌷"</p>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-design">Tap to reveal ♥</div>
                        </div>
                        <div class="card-back">
                            <p>"May this Valentine’s Day bring all the love your heart can hold!✨."</p>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-design">Tap to reveal ♥</div>
                        </div>
                        <div class="card-back">
                            <p>"Every love story is beautiful, but ours is definitely my favorite.💫"</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
